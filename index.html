<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Jeu : Devine le nombre</title>

  <!-- Police Agrandir -->
  <link href="https://fonts.googleapis.com/css2?family=Agrandir&display=swap" rel="stylesheet">

  <!-- Son de victoire -->
  <audio id="victoireSound" src="https://www.soundjay.com/human/sounds/applause-01.mp3" preload="auto"></audio>

  <style>
    body {
      font-family: 'Agrandir', sans-serif;
      background-color: blue;
      color: white;
      text-align: center;
      margin-top: 30px;
    }

    input, button {
      font-size: 18px;
      padding: 10px;
      margin: 10px;
      border: none;
      border-radius: 5px;
    }

    button {
      background-color: white;
      color: indigo;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #ddd;
    }

    #resultat {
      font-size: 20px;
      margin-top: 20px;
    }

    #logo {
      width: 150px;
      margin-bottom: 20px;
    }

    #score {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- Image/logo en haut -->
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Emoji_u1f914.svg/1024px-Emoji_u1f914.svg.png" alt="Logo" id="logo">

  <h1>Bienvenue Sarah dans le jeu : Devine le nombre (Niveau difficile)</h1>

  <input type="number" id="choix" min="1" max="50" placeholder="1 à 50" />
  <button onclick="verifier()">Deviner</button>
  <button onclick="rejouer()" id="rejouer" style="display:none;">Rejouer</button>

  <p id="resultat"></p>

  <div id="score">
    Victoires : <span id="v">0</span> |
    Défaites : <span id="d">0</span>
  </div>

  <script>
    let nombreSecret = Math.floor(Math.random() * 50) + 1;
    let essaisRestants = 5;
    let jeuTerminé = false;
    let victoires = 0;
    let defaites = 0;
    const prenom = "Sarah"; // Personnalisation du message

    const victoireSound = document.getElementById("victoireSound");

    function verifier() {
      if (jeuTerminé) return;

      const choix = parseInt(document.getElementById("choix").value);
      const message = document.getElementById("resultat");

      if (isNaN(choix) || choix < 1 || choix > 50) {
        message.textContent = `${prenom}, entre un nombre entre 1 et 50.`;
        return;
      }

      if (choix === nombreSecret) {
        message.textContent = `Bravo ${prenom} ! Tu as deviné le bon nombre !`;
        victoireSound.play();
        victoires++;
        document.getElementById("v").textContent = victoires;
        finDeJeu();
      } else {
        essaisRestants--;
        if (essaisRestants === 0) {
          message.textContent = `Dommage ${prenom} ! Le bon nombre était ${nombreSecret}.`;
          defaites++;
          document.getElementById("d").textContent = defaites;
          finDeJeu();
        } else {
          const indice = choix < nombreSecret ? "C’est plus grand." : "C’est plus petit.";
          message.textContent = `${indice} Il te reste ${essaisRestants} essai(s).`;
        }
      }
    }

    function finDeJeu() {
      jeuTerminé = true;
      document.getElementById("rejouer").style.display = "inline";
    }

    function rejouer() {
      nombreSecret = Math.floor(Math.random() * 50) + 1;
      essaisRestants = 5;
      jeuTerminé = false;
      document.getElementById("choix").value = "";
      document.getElementById("resultat").textContent = "";
      document.getElementById("rejouer").style.display = "none";
    }
  </script>
</body>
</html>
