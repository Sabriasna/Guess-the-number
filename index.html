<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Jeu : Devine le nombre</title>

  <!-- Police Agrandir -->
  <link href="https://fonts.googleapis.com/css2?family=Agrandir&display=swap" rel="stylesheet">

  <!-- Son de victoire -->
  <audio id="victoireSound" src="https://www.soundjay.com/human/sounds/applause-01.mp3" preload="auto"></audio>

  <style>
    body {
      font-family: 'Agrandir', sans-serif;
      background-color: #DE8F5E;
      color: #873A1A;
      text-align: center;
      margin-top: 30px;
    }

    input, button, select {
      font-size: 18px;
      padding: 10px;
      margin: 10px;
      border: none;
      border-radius: 5px;
    }

    button {
      background-color: #873A1A;
      color: #DE8F5E;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #ddd;
    }

    #resultat, #chrono {
      font-size: 20px;
      margin-top: 20px;
    }

	#logo {
      width: 150px;
      margin-bottom: 20px;
    }
    
    #score {
      margin-top: 20px;
      font-size: 18px;
    }

    #jeu, #rejouer {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Logo -->
  <img src="Disque.png" alt="Logo" id="logo">

  <!-- Accueil -->
  <div id="accueil">
    <h1>Bienvenue !</h1>
    <p>Entre ton prénom et choisis ton niveau :</p>
    <input type="text" id="prenomInput" placeholder="Ton prénom" />
    <br>
    <select id="niveau">
      <option value="facile">Facile (1-10)</option>
      <option value="normal" selected>Normal (1-25)</option>
      <option value="difficile">Difficile (1-50)</option>
    </select>
    <br>
    <button onclick="demarrerJeu()">Commencer le jeu</button>
  </div>

  <!-- Jeu -->
  <div id="jeu">
    <h2 id="titreJeu"></h2>
    <p id="consigne"></p>
    <input type="number" id="choix" />
    <button onclick="verifier()">Deviner</button>
    <button onclick="rejouer()" id="rejouer">Rejouer</button>

    <p id="resultat"></p>
    <p id="chrono">Temps restant : <span id="temps">30</span>s</p>

    <div id="score">
      Victoires : <span id="v">0</span> |
      Défaites : <span id="d">0</span>
    </div>
  </div>

  <script>
    let nombreSecret;
    let essaisRestants;
    let jeuTerminé = false;
    let victoires = 0;
    let defaites = 0;
    let prenom = "";
    let tempsRestant = 30;
    let timer;
    let maxNombre = 25;

    const victoireSound = document.getElementById("victoireSound");

    function demarrerJeu() {
      const input = document.getElementById("prenomInput").value.trim();
      if (!input) return alert("Entre ton prénom avant de jouer !");
      prenom = input.charAt(0).toUpperCase() + input.slice(1).toLowerCase();

      const niveau = document.getElementById("niveau").value;
      if (niveau === "facile") maxNombre = 10;
      else if (niveau === "normal") maxNombre = 25;
      else maxNombre = 50;

      document.getElementById("choix").setAttribute("min", "1");
      document.getElementById("choix").setAttribute("max", maxNombre.toString());

      document.getElementById("accueil").style.display = "none";
      document.getElementById("jeu").style.display = "block";
      document.getElementById("titreJeu").textContent = `Bonne chance ${prenom} !`;
      document.getElementById("consigne").textContent = `Devine un nombre entre 1 et ${maxNombre}`;

      initialiserJeu();
    }

    function initialiserJeu() {
      nombreSecret = Math.floor(Math.random() * maxNombre) + 1;
      essaisRestants = 5;
      jeuTerminé = false;
      tempsRestant = 30;
      document.getElementById("choix").value = "";
      document.getElementById("resultat").textContent = "";
      document.getElementById("rejouer").style.display = "none";
      document.getElementById("temps").textContent = tempsRestant;
      clearInterval(timer);
      timer = setInterval(decompte, 1000);
    }

    function decompte() {
      if (tempsRestant > 0) {
        tempsRestant--;
        document.getElementById("temps").textContent = tempsRestant;
      } else {
        clearInterval(timer);
        if (!jeuTerminé) {
          document.getElementById("resultat").textContent = `Temps écoulé ${prenom} ! Le nombre était ${nombreSecret}.`;
          defaites++;
          document.getElementById("d").textContent = defaites;
          finDeJeu();
        }
      }
    }

    function verifier() {
      if (jeuTerminé) return;

      const choix = parseInt(document.getElementById("choix").value);
      const message = document.getElementById("resultat");

      if (isNaN(choix) || choix < 1 || choix > maxNombre) {
        message.textContent = `${prenom}, entre un nombre entre 1 et ${maxNombre}.`;
        return;
      }

      if (choix === nombreSecret) {
        message.textContent = `Bravo ${prenom} ! Tu as deviné le bon nombre !`;
        victoireSound.play();
        victoires++;
        document.getElementById("v").textContent = victoires;
        finDeJeu();
      } else {
        essaisRestants--;
        if (essaisRestants === 0) {
          message.textContent = `Dommage ${prenom} ! Le bon nombre était ${nombreSecret}.`;
          defaites++;
          document.getElementById("d").textContent = defaites;
          finDeJeu();
        } else {
          const indice = choix < nombreSecret ? "C’est plus grand." : "C’est plus petit.";
          message.textContent = `${indice} Il te reste ${essaisRestants} essai(s).`;
        }
      }
    }

    function finDeJeu() {
      jeuTerminé = true;
      clearInterval(timer);
      document.getElementById("rejouer").style.display = "inline";
    }

    function rejouer() {
      initialiserJeu();
    }
  </script>
</body>
</html>
